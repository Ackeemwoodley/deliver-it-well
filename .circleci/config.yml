version: 2.1

# Orbs are reusable packages of CircleCI configuration
orbs:
  node: circleci/node@5.2

jobs:
  # Job to run tests (you may modify this job if needed)
  node/test:
    docker:
      - image: circleci/node:16.10
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm install
      - run:
          name: Run Tests
          command: npm test

  # Job to deploy to Vercel
  deploy:
    docker:
      - image: cimg/node:16.10
    steps:
      - checkout
      - run:
          name: Install Vercel CLI
          command: npm install -g vercel
      - run:
          name: Deploy to Vercel
          command: vercel --prod --token=$VERCEL_TOKEN --yes

workflows:
  version: 2
  sample:  # This is the name of the workflow
    jobs:
      - node/test:  # Run the test job first
          version: '16.10'
          pkg-manager: npm
      - deploy:  # Run the deploy job after tests pass
          requires:
            - node/test
          filters:
            branches:
              only: main  # Only deploy from the 'main' branch
